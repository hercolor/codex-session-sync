codex_home: ~/.codex
# Claude Code project conversations and memory are synced separately.
claude_home: ~/.claude
machine_id: my-machine
# Local file-level incremental baseline. Keep this outside codex_home.
# On a new device, existing remote files are content-checked once before the
# local incremental baseline is created.
manifest_path: ~/.codex-session-sync/manifest.json
# Independent local baseline for Claude Code. Keep it outside claude_home.
claude_manifest_path: ~/.codex-session-sync/claude-manifest.json
# Optional: defaults to a sibling of webdav.remote_path (e.g. /codex-sync-claude).
# claude_remote_path: /claude-sync

sync:
  mode: cold
  # bidirectional | push | pull; controls which side is authoritative.
  direction: bidirectional
  compare: mtime
  time_tolerance_seconds: 2
  equal_mtime_action: skip
  delete_policy: never
  session_mode: all

conflict:
  policy: manual_abort

backup:
  enabled: true
  compression: none
  retention_days: 30
  max_backups: 0

webdav:
  url: https://your-webdav-server/remote.php/dav/files/username
  username: your_username
  password: your_password
  remote_path: /codex-sync
  # Each client keeps its own internal .cxsync-manifest.json at its remote path.
  # Both repositories use these same WebDAV credentials.

server:
  port: 7420
  open_browser: true

logging:
  level: INFO
  file: ~/.codex-session-sync/logs/sync.log
